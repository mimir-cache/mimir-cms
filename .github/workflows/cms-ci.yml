name: CMS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mimir
          POSTGRES_PASSWORD: mimir
          POSTGRES_DB: mimir_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimir -d mimir_cms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://mimir:mimir@localhost:5432/mimir_cms
      PAYLOAD_SECRET: ci-only-secret-value-do-not-use-in-production
      MIMIR_BACKEND_URL: http://localhost:8000
      MIMIR_ADMIN_API_KEY: ci-only-admin-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test

      - name: Check TypeScript types
        run: pnpm typecheck

      - name: Build production CMS
        run: pnpm build
